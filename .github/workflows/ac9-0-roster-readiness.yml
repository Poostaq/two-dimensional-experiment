name: AC9.0 Roster Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Scripts/**"
      - "Scenes/**"
      - "Tests/**"
      - "Docs/Specs/AC9/**"
      - ".github/workflows/ac9-0-roster-readiness.yml"
  push:
    branches: [main]

jobs:
  ac9-0-roster-readiness:
    name: ac9-0-roster-readiness
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run AC9.0 and regression matrix
        shell: pwsh
        run: ./Scripts/CI/run_ac9_0.ps1 -GodotPath (Get-Command godot).Source

      - name: Upload AC9.0 automated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac9-0-automated-test-log
          path: Docs/Specs/AC9/Evidence/AC9.0/automated-test.log
          if-no-files-found: error
